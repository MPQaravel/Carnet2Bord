name: Release — build natif (dmg macOS, msi Windows) + fichier unique

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tauri:
    name: Build Tauri (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Dépendances frontend
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri macOS (app + dmg)
        if: startsWith(matrix.os, 'macos')
        run: npx tauri build --target ${{ matrix.target }} --bundles app,dmg

      - name: Build Tauri Windows (msi)
        if: matrix.os == 'windows-latest'
        run: npx tauri build --target ${{ matrix.target }} --bundles msi

      - name: Lister les artefacts produits
        shell: bash
        run: ls -laR src-tauri/target/*/release/bundle || true

      - name: Publier les artefacts dans la release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" carnet-de-bord.html --title "Carnet de bord ${TAG}" --notes "Build ${TAG} — dmg macOS, msi Windows, et carnet-de-bord.html (fichier unique navigateur)." 2>/dev/null || gh release upload "$TAG" carnet-de-bord.html --clobber
          shopt -s nullglob
          for f in src-tauri/target/*/release/bundle/dmg/*.dmg; do
            echo "upload: $f"; gh release upload "$TAG" "$f" --clobber
          done
          for f in src-tauri/target/*/release/bundle/msi/*.msi; do
            echo "upload: $f"; gh release upload "$TAG" "$f" --clobber
          done
          for app in src-tauri/target/*/release/bundle/macos/*.app; do
            zip -qr "${app}.zip" "$app"
            echo "upload: ${app}.zip"; gh release upload "$TAG" "${app}.zip" --clobber
          done
          gh release view "$TAG" --json assets --jq '.assets[].name'
