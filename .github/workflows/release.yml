name: Release — build natif (dmg macOS, msi Windows) + fichier unique

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tauri:
    name: Build Tauri (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Dépendances frontend
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri macOS (app + dmg)
        if: matrix.os == 'macos-latest'
        run: npx tauri build --target ${{ matrix.target }} --bundles app,dmg

      - name: Build Tauri Windows (msi)
        if: matrix.os == 'windows-latest'
        run: npx tauri build --target ${{ matrix.target }} --bundles msi

      - name: Publier les artefacts dans la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: false
          files: |
            carnet-de-bord.html
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.zip
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
